<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ILYA | Interactive Experience</title>
    
    <link rel="icon" href="https://iili.io/qWN5VvR.md.jpg" type="image/jpeg">
    <meta name="description" content="إيليا — مطوّر أنظمة تفاعلية فائقة الأداء">
    <meta name="theme-color" content="#050002">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <link rel="stylesheet" href="style.css">

    <script>
        window.ILYA_CONFIG = {
            images: {
                logo: 'https://iili.io/qWN5VvR.md.jpg',
                banner: 'https://iili.io/fb6SvS9.md.jpg',
                profile: 'https://iili.io/fb64ziv.md.jpg'
            },
            links: [
                { name: 'YouTube',   url: 'https://youtube.com/@scv_t',  icon: 'fab fa-youtube',   handle: 'scv_t' },
                { name: 'Instagram', url: 'https://instagram.com/szc2v', icon: 'fab fa-instagram', handle: 'szc2v' },
                { name: 'Telegram',  url: 'https://t.me/ILYA3bot',       icon: 'fab fa-telegram',  handle: '@ILYA3bot' },
                { name: 'Channel',   url: 'https://t.me/swc_t',          icon: 'fas fa-bullhorn',  handle: 'swc_t' }
            ]
        };
    </script>
</head>
<body>

    <div id="webgl-container" aria-hidden="true"></div>

    <main id="ui-layer">
        
        <div id="loader" class="loader-screen">
            <div class="loader-content">
                <div class="loader-logo-wrapper">
                    <img src="https://iili.io/qWN5VvR.md.jpg" alt="ILYA Logo" class="loader-logo">
                    <div class="loader-ring"></div>
                </div>
                <h1 class="loader-title">ILYA SYSTEM</h1>
                <div class="loader-progress-bar">
                    <div class="loader-progress-fill" id="loader-fill"></div>
                </div>
                <span class="loader-percentage" id="loader-pct">0%</span>
            </div>
        </div>

        <div id="image-modal" class="modal-overlay" aria-hidden="true">
            <button id="modal-close" class="modal-close-btn"><i class="fas fa-times"></i></button>
            <img id="modal-img" src="" alt="Full View">
        </div>

        <article id="main-card" class="glass-card hidden">
            
            <header class="card-banner" id="banner-trigger">
                <img src="https://iili.io/fb6SvS9.md.jpg" alt="Banner" class="banner-image">
                <div class="banner-overlay"></div>
                <div class="live-badge"><span class="pulse-dot"></span> LIVE</div>
            </header>

            <div class="profile-container">
                <div class="profile-wrapper" id="profile-trigger">
                    <div class="profile-glow"></div>
                    <img src="https://iili.io/fb64ziv.md.jpg" alt="إيليا" class="profile-image">
                </div>
            </div>

            <section class="profile-info">
                <h1 class="user-name">إيليا <span class="user-handle">ILYA</span></h1>
                <h2 class="user-role">[ Web Engineer & UI Architect ]</h2>
                <div class="bio-box">
                    <p>مطوّر ويب محترف متخصص في دمج الذكاء الاصطناعي مع تطبيقات الويب الحديثة. أبني أنظمة تفاعلية عالية الأداء وأؤمن بأن الجماليات والوظائف يجب أن تعمل معاً بتناغم تام لخلق تجربة رقمية لا تُنسى.</p>
                </div>
            </section>

            <section class="links-section">
                <h3 class="section-title"><span>تواصل</span></h3>
                <div class="links-grid" id="links-grid">
                    </div>
            </section>

            <footer class="card-footer">
                <div class="footer-divider"></div>
                <div class="footer-content">
                    <p class="copyright">© 2026 ILYA — جميع الحقوق محفوظة</p>
                </div>
            </footer>

        </article>
    </main>

    <script src="main.js"></script>
</body>
</html>
